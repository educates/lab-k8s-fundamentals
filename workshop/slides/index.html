<!doctype html>
<html>
        <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

                <title>reveal.js</title>

                <link rel="stylesheet" href="dist/reset.css">
                <link rel="stylesheet" href="dist/reveal.css">
                <link rel="stylesheet" href="dist/theme/black.css">

                <!-- Theme used for syntax highlighting of code -->
                <link rel="stylesheet" href="plugin/highlight/monokai.css">
        </head>
        <body>
                <div class="reveal">
                        <div class="slides">
                                <section>
                                    <h2>Kubernetes Fundamentals</h2>
                                </section>
                                <section>
                                    <img src="kubernetes-mind-blown.png" />
                                </section>
                                <section>
                                    <img class="r-stretch" src="big-red-container.png" />
                                </section>
                                <section>
                                    <img src="virtualisation-vs-containers.png" />
                                </section>
                                <section>
                                    <img src="building-an-image.png" />
                                </section>
                                <section>
                                    <img src="running-an-image.png" />
                                </section>
                                <section>
                                    <img class="r-stretch" src="container-in-boat.png" />
                                </section>
                                <section>
                                    <img class="r-stretch" src="container-ship-on-fire.png" />
                                </section>
                                <section>
                                    <img src="kubernetes-cluster.png" />
                                </section>
                                <section>
                                    <img src="live-demo.png" />
                                </section>
                                <section>
                                    <h2>Questions?</h2>
                                </section>
                        </div>
                </div>

                <script src="dist/reveal.js"></script>
                <script src="plugin/markdown/markdown.js"></script>
                <script src="plugin/notes/notes.js"></script>
                <script src="plugin/highlight/highlight.js"></script>

                <script>
                        // More info about initialization & config:
                        // - https://revealjs.com/initialization/
                        // - https://revealjs.com/config/
                        Reveal.initialize({
                                hash: true,

                                // Learn about plugins: https://revealjs.com/plugins/
                                plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
                        });
                </script>
        </body>
</html>
