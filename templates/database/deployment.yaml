#@ load("@ytt:data", "data")

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-db
  labels:
    app: blog-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: blog-db
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgresql
        image: postgres:17.7
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 999
          #@ if data.values.POLICY_ENGINE in ["pod-security-standards", "kyverno"]:
          seccompProfile:
            type: RuntimeDefault
          #@ end
        resources:
          limits:
            memory: 512Mi
        ports:
        - containerPort: 5432
          protocol: TCP
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: database-user
              name: blog-credentials
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: blog-credentials
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: database-name
              name: blog-credentials
        #! livenessProbe:
        #!   exec:
        #!     command:
        #!     - "/usr/libexec/check-container"
        #!     - "--live"
        #!   initialDelaySeconds: 120
        #!   timeoutSeconds: 10
        #! readinessProbe:
        #!   exec:
        #!     command:
        #!     - "/usr/libexec/check-container"
        #!   initialDelaySeconds: 5
        #!   timeoutSeconds: 1
        volumeMounts:
        - name: data
          mountPath: "/var/lib/postgresql/data"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: blog-database
